# Validate the YAML data, render the site and check every link.
# Runs on pull requests, on pushes to main, and weekly (to catch links that die later).
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install helper-script dependencies
        run: pip install -r requirements.txt

      - name: Validate data
        run: python scripts/validate.py

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - name: Render
        run: quarto render

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/_site
            './_site/**/*.html'
          fail: true
