- id: opatrny-2020-eu-accession-farm
  type: article
  status: published
  visible: true
  needs_review: false
  featured: false
  title: "The Impact of EU Accession on Farm Production in the Czech Republic: A Synthetic Control Method Approach"
  authors: [Matej Opatrny]
  coauthors_display: ""
  journal: Czech Journal of Economics and Finance
  year: 2020
  volume: "70"
  issue: "3"
  pages: 281-307
  article_number: ""
  doi: 10.32065/CJEF.2020.03.05
  url: ""
  abstract: >-
    Czech farmers experienced an enormous exogenous shock when they joined the common agricultural
    market (CAM) and the Common Agricultural Policy (CAP) in 2004. Using the World Bank's dataset,
    we apply the synthetic control method to establish a counterfactual case of the Czech Republic
    food production index in the absence of the CAM and CAP. The results show that the Czech
    Republic would have had a higher food index if it had not entered the CAM and CAP. Moreover, we
    show that the CAP and CAM had different impacts on farms in the Czech Republic and Bulgaria,
    which have the most comparable agriculture according to the results of the synthetic control
    method.
  categories: [Agricultural & environmental policy, Policy evaluation]
  links: {}

