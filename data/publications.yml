- id: opatrny-2017-cnb-exchange-rate
  type: article
  status: published
  visible: true
  needs_review: false
  featured: false
  title: "Quantifying the Effects of the CNB's Exchange Rate Commitment: A Synthetic Control Method Approach"
  authors: [Matej Opatrny]
  coauthors_display: ""
  journal: Czech Journal of Economics and Finance
  year: 2017
  volume: "67"
  issue: "6"
  pages: 539-577
  article_number: ""
  doi: ""
  url: "https://journal.fsv.cuni.cz/mag/article/show/id/1396"
  abstract: >-
    In this paper I evaluate the quantitative effects of the Czech National Bank's commitment to keep
    the Koruna from appreciating that were put in place in 2013. I focus on the policy's impact on
    output, unemployment, and inflation. I use the synthetic control method, which allows me to
    compute the counter-factual development of the Czech economy in the absence of the commitment. I
    find that the commitment helped decrease unemployment substantially. The effect on overall
    output is also strongly positive, almost 2 percentage points for growth in 2015, but only
    marginally statistically significant, which might be connected to disturbances created by
    changes in excise taxes. The effect of the commitment on inflation is positive but not
    statistically significant at standard levels.
  categories: [Policy evaluation]
  # Video: ČNB vlog interview about the award-winning bachelor's thesis behind this paper.
  links: {video: "https://www.cnb.cz/cs/o_cnb/vlog-cnb/Autor-ocenene-prace-Matej-Opatrny-Me-propocty-ukazuji-na-priznivy-dopad-kurzoveho-zavazku"}
